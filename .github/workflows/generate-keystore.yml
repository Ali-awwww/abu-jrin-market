# سير عمل مؤقت لمرة واحدة: توليد مفتاح توقيع Release ثابت (PKCS12، الاسم المستعار upload)
# داخل GitHub Actions فقط، ثم يُحذف هذا الملف بعد الاستخدام.
# لا يحتوي أي سر، ولا يطبع أي كلمة مرور في السجل: كلمة المرور تُولَّد عشوائياً
# داخل التشغيل، وتُحفظ في أسرار GitHub وفي ملفَي الأرتيفاكت فقط.
# يُشغَّل يدوياً فقط (workflow_dispatch)، ولا يُشغَّل عند الدفع.
# ملاحظة: في PKCS12 تتساوى كلمة مرور المفتاح مع كلمة مرور المخزن، لذلك نستخدم
# كلمة مرور واحدة لكليهما (يتجاهل keytool قيمة ‎-keypass‎ مختلفة).
name: توليد مفتاح التوقيع (مرة واحدة)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: توليد مفتاح PKCS12 وكلمة مرور عشوائية
        run: |
          set -euo pipefail
          STOREPASS="$(openssl rand -hex 12)"
          rm -f release.keystore
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 9125 \
            -keystore release.keystore -storetype PKCS12 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Abu Jrin Market, O=Abu Jrin Market, C=SY"
          {
            echo "ANDROID_KEY_ALIAS=upload"
            echo "ANDROID_KEYSTORE_PASSWORD=$STOREPASS"
            echo "ANDROID_KEY_PASSWORD=$STOREPASS"
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 release.keystore)"
          } > passwords.txt
          keytool -list -v -keystore release.keystore -storepass "$STOREPASS" -storetype PKCS12 | grep -E "SHA256|Alias name" >> passwords.txt
          ls -lh release.keystore
          echo "تم توليد المفتاح؛ كلمات المرور والبصمة في ملفَي الأرتيفاكت فقط."

      - name: رفع المفتاح وملف كلمات المرور
        uses: actions/upload-artifact@v4
        with:
          name: abu-jrin-signing-key
          path: |
            release.keystore
            passwords.txt
          retention-days: 30

      - name: حفظ المفتاح وكلمات المرور في أسرار GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALIAS="$(grep '^ANDROID_KEY_ALIAS=' passwords.txt | cut -d= -f2-)"
          STOREPASS="$(grep '^ANDROID_KEYSTORE_PASSWORD=' passwords.txt | cut -d= -f2-)"
          KEYPASS="$(grep '^ANDROID_KEY_PASSWORD=' passwords.txt | cut -d= -f2-)"
          B64="$(grep '^ANDROID_KEYSTORE_BASE64=' passwords.txt | cut -d= -f2-)"
          printf '%s' "$B64" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$STOREPASS" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KEYPASS" | gh secret set ANDROID_KEY_PASSWORD --repo "$GITHUB_REPOSITORY"
          echo "تم حفظ الأسرار الأربعة."
