# سير عمل مؤقت لمرة واحدة: توليد مفتاح توقيع Release ثابت (PKCS12، الاسم المستعار upload)
# داخل GitHub Actions فقط، ثم يُحذف هذا الملف بعد الاستخدام.
# لا يحتوي أي سر، ولا يطبع أي كلمة مرور في السجل: كلمات المرور تُولَّد عشوائياً
# داخل التشغيل وتُحفظ في ملفَي الأرتيفاكت فقط.
# يُشغَّل يدوياً فقط (workflow_dispatch)، ولا يُشغَّل عند الدفع.
name: توليد مفتاح التوقيع (مرة واحدة)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: توليد مفتاح PKCS12 وكلمات مرور عشوائية
        run: |
          set -euo pipefail
          STOREPASS="$(openssl rand -hex 12)"
          KEYPASS="$(openssl rand -hex 12)"
          rm -f release.keystore
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 9125 \
            -keystore release.keystore -storetype PKCS12 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "CN=Abu Jrin Market, O=Abu Jrin Market, C=SY"
          {
            echo "ANDROID_KEY_ALIAS=upload"
            echo "ANDROID_KEYSTORE_PASSWORD=$STOREPASS"
            echo "ANDROID_KEY_PASSWORD=$KEYPASS"
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 release.keystore)"
          } > passwords.txt
          keytool -list -v -keystore release.keystore -storepass "$STOREPASS" -storetype PKCS12 | grep -E "SHA256|Alias name" >> passwords.txt
          ls -lh release.keystore
          echo "تم توليد المفتاح؛ كلمات المرور والبصمة في ملفَي الأرتيفاكت فقط."

      - name: رفع المفتاح وملف كلمات المرور
        uses: actions/upload-artifact@v4
        with:
          name: abu-jrin-signing-key
          path: |
            release.keystore
            passwords.txt
          retention-days: 30
