# بناء تطبيق أندرويد من نفس كود الويب عبر Capacitor، وتوقيع Release ثابت.
# يقرأ التوقيع من أسرار GitHub فقط (لا يوجد أي سر في هذا الملف):
# ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD.
name: بناء APK أندرويد (Release)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
      type: string
      default: "false"
      release_tag:
        description: "وسم الإصدار (مثال: v1.1)"
        type: string
        default: "v1.1"
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4
      - name: تثبيت Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: تثبيت Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: تثبيت Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3
        with:
          # الافتراضي في v3 يثبّت حزمة «tools» المحذوفة من مستودع Google فيفشل sdkmanager؛ نثبّت صراحةً ما يحتاجه Capacitor 7 فقط.
          packages: platform-tools build-tools;35.0.0 platforms;android-35
      - name: تثبيت الاعتماديات
        run: bun install
      - name: بناء نسخة الويب (SPA)
        run: |
          bun run build
          # وضع SPA في TanStack Start يولّد قالب التطبيق باسم _shell.html داخل dist/client
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
          fi
          test -f dist/client/index.html || { echo "لا يوجد index.html في dist/client" >&2; ls -R dist | head -100; exit 1; }
      - name: استعادة مفتاح التوقيع من الأسرار
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -storetype PKCS12
      - name: إعداد مشروع Capacitor
        run: |
          test -f capacitor.config.ts || node_modules/.bin/cap init "سوق أبو جرين" com.abujrin.market --web-dir=dist/client
          node_modules/.bin/cap add android
          node_modules/.bin/cap sync android
      - name: بناء APK بتوقيع Release
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: التحقق من توقيع الـ APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: abu-jrin-market-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: APK info
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -1)"
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^application-label:"
